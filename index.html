    <!-- Typefaces are self-hosted and same-origin, so preloading them costs one
         hop and removes the swap on first paint. -->
    <link rel="preload" href="/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin />

    <script>
      // Applied before first paint so the correct palette is never repainted.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* No storage available. The light default stands. */
        }
      })();
    </script>
